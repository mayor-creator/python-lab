<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books</title>
</head>

<body>
  <main>
    <h1>My library</h1>
    <div>
      <a href="{{ url_for('add_book')}}">Add New Book</a>
    </div>
    <h2>My Reading List: </h2>
    {% if not books %}
    <p>library is empty.</p>
    {% endif %}
    <ul>
      {% for book in books %}
      <li>{{ book.title }} - {{ book.author }}</li>
      {% endfor %}
    </ul>

  </main>
</body>

</html>
